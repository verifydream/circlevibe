[config]
temperature = 0.2
response_language = "id-ID"
custom_model_max_tokens = 16384

[pr_reviewer]
require_tests_review = true
require_security_review = true
num_max_findings = 5
extra_instructions = """Focus on:
- Security vulnerabilities (auth, SQL injection, XSS)
- Error handling gaps
- Performance issues
- Next.js best practices
- TypeScript type safety
"""

[pr_code_suggestions]
commitable_code_suggestions = true
focus_only_on_problems = true
